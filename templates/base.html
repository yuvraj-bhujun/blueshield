<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}BlueShield AI{% endblock %}</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🛰️</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    {% block head %}{% endblock %}
</head>
<body>
    <div class="scanline-overlay" aria-hidden="true"></div>

    <header class="topbar">
        <a href="{{ url_for('index') }}" class="brand">
            <span class="brand-mark" aria-hidden="true">🛰️</span>
            <span class="brand-text">BlueShield<em>AI</em></span>
        </a>
        <nav class="mainnav">
            <a href="{{ url_for('coastguard_page') }}" class="active">Coast Guard</a>
            <a href="{{ url_for('map_page') }}">Hazard Map</a>
        </nav>
        <button class="navtoggle" id="navToggle" aria-label="Toggle navigation">
            <span></span><span></span><span></span>
        </button>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer class="sitefoot">
        <div>BlueShield AI — prototype for Mauritius EEZ</div>
    </footer>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
